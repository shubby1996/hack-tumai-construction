<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <title>Cats Track</title>
  <link rel="icon" href="../public/icon.svg">
  <!-- Tailwind via CDN (needs internet). Design tokens below: edit them to restyle the whole mock.
       In the real app (Tailwind 4) they become @theme variables in src/app/globals.css. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#1e1f21",      // text, dark surfaces
            muted: "#6d6e6f",    // secondary text (kept dark for sunlight)
            faint: "#9ca0a4",    // tertiary text
            line: "#e0e0e0",     // borders
            soft: "#f1f1f1",     // subtle fills, dividers
            canvas: "#f9f8f8",   // page background
            accent: { DEFAULT: "#f06a6a", dark: "#e8384f", soft: "#fde3e3", tint: "#fff5f5" }, // coral (Asana-style)
            sel: { DEFAULT: "#4573d2", soft: "#eef3fd" },  // selection, info
            ok: { DEFAULT: "#15803d", soft: "#dcfce7" },
            bad: { DEFAULT: "#b91c1c", soft: "#fee2e2" },
            warn: { DEFAULT: "#a16207", soft: "#fef3c7" },
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #1e1f21; background: #f9f8f8; -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="app"><p style="padding:2rem;color:#3f3f46">Loading…</p></div>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
