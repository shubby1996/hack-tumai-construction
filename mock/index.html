<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18181b">
  <title>SiteFlow Mock</title>
  <link rel="icon" href="../public/icon.svg">
  <!-- Tailwind via CDN (needs internet). Design tokens below: edit them to restyle the whole mock.
       In the real app (Tailwind 4) they become @theme variables in src/app/globals.css. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#18181b",      // text, dark surfaces
            muted: "#3f3f46",    // secondary text (kept dark for sunlight)
            faint: "#71717a",    // tertiary text
            line: "#d4d4d8",     // borders
            soft: "#e4e4e7",     // subtle fills, dividers
            canvas: "#f4f4f5",   // page background
            accent: { DEFAULT: "#c2410c", dark: "#9a3412", soft: "#ffedd5", tint: "#fff7ed" }, // hi-vis orange
            sel: { DEFAULT: "#0e7490", soft: "#ecfeff" },  // selection, info
            ok: { DEFAULT: "#15803d", soft: "#dcfce7" },
            bad: { DEFAULT: "#b91c1c", soft: "#fee2e2" },
            warn: { DEFAULT: "#a16207", soft: "#fef3c7" },
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: #18181b; background: #f4f4f5; -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <div id="app"><p style="padding:2rem;color:#3f3f46">Loading…</p></div>
  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
